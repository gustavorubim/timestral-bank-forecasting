[project]
name = "bsforecast"
version = "0.1.0"
description = "Experimental bank balance-sheet forecasting: Timestral zero-shot vs AutoARIMA, direct 8-quarter horizon"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "statsforecast>=1.7",
    "torch>=2.4",
    "timestral @ git+https://github.com/mistralai/timestral.git",
]

[project.scripts]
bsforecast = "bsforecast.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/bsforecast"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
