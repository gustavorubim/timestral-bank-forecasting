# Retail (daily): M5 Walmart unit sales aggregated to store x department (10 x 7 = 70 series), 28-day one-shot.
# Data mirror: huggingface.co/datasets/kashif/M5 (original Kaggle competition files).
# AutoARIMA omitted: seasonal AutoARIMA on 70 daily series x ~1,100-day contexts did not finish one origin in 10 min on the shared box.
name: retail_m5
output_dir: reports/retail/m5
notes_file: experiments/retail/findings_m5.md
data:
  path: data/processed/m5_store_dept_panel.parquet
  date_col: date
  id_col: id
  freq: D
  targets: [units]
  covariates: [price_index, snap, dow_sin, dow_cos, event_sporting, event_cultural, event_national, event_religious, christmas]
  groups:
    store_dept_units: [units]
backtest:
  horizon: 28
  n_origins: 24
  step: 14
  min_train: 365
  live_forecast: false
models:
- {name: seasonal_naive, type: seasonal_naive, season_length: 7}
- {name: ets, type: auto_ets, season_length: 7, n_jobs: 3}
- {name: timestral, type: timestral, threads: 4}
- name: timestral_calendar_known
  type: timestral
  threads: 4
  covariates: known_oracle
  covariate_subset: [snap, dow_sin, dow_cos, event_sporting, event_cultural, event_national, event_religious, christmas]
- {name: timestral_all_known, type: timestral, threads: 4, covariates: known_oracle}
evaluation:
  baseline: seasonal_naive
  challenger: timestral
  mase_season: 7
  quantiles: [0.05, 0.1, 0.5, 0.9, 0.95]
plots:
  spaghetti_models: [seasonal_naive, ets, timestral, timestral_all_known]
  spaghetti_by_group: true
  spaghetti_ids: [CA_1|FOODS_3, CA_3|HOUSEHOLD_1, TX_2|FOODS_3, TX_1|HOBBIES_1, WI_2|FOODS_2, WI_3|HOUSEHOLD_2]
  compare_pairs:
  - [timestral_calendar_known, timestral]
  - [timestral_all_known, timestral]
  - [timestral, seasonal_naive]
  - [ets, seasonal_naive]
