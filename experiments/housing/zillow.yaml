# Housing (monthly): Zillow ZHVI (home values, $k) and ZORI (rents, $) for 22 metros, 24-month one-shot.
name: housing_zillow
output_dir: reports/housing/zillow
notes_file: experiments/housing/findings_zillow.md
data:
  path: data/processed/housing_zillow_panel.parquet
  date_col: date
  id_col: id
  freq: ME
  targets: [zhvi, zori]
  covariates: [mortgage_rate, unemployment, rdi_growth]
  groups:
    values_and_rents: [zhvi, zori]
backtest:
  horizon: 24
  n_origins: 30
  step: 2
  min_train: 60
  live_forecast: true
  stress_windows:
    covid_boom: ['2019-09-30', '2021-03-31']
    rate_shock_2022: ['2021-06-30', '2022-12-31']
# AutoARIMA dropped (seasonal m=12, h=24 too slow on the shared box); baselines = AutoETS (reference) + seasonal naive.
models:
- {name: seasonal_naive, type: seasonal_naive, season_length: 12}
- {name: ets, type: auto_ets, season_length: 12, n_jobs: 3}
- {name: timestral, type: timestral, threads: 4}
- {name: timestral_macro_past, type: timestral, threads: 4, covariates: past}
- {name: timestral_macro_known, type: timestral, threads: 4, covariates: known_oracle}
evaluation:
  baseline: ets
  challenger: timestral
  mase_season: 1
  quantiles: [0.05, 0.1, 0.5, 0.9, 0.95]
plots:
  spaghetti_models: [seasonal_naive, ets, timestral, timestral_macro_known]
  spaghetti_by_group: true
  spaghetti_ids: [Tampa, Orlando, Miami, Austin, Phoenix, Denver, NewYork, Chicago, SanFrancisco, Seattle]
  compare_pairs:
  - [timestral_macro_known, timestral]
  - [timestral_macro_past, timestral]
  - [timestral, ets]
